worker_processes 1;
events { worker_connections 1024; }
http {
  log_format probe '$time_iso8601 "$request" status=$status content_length=$http_content_length request_length=$request_length sent=$body_bytes_sent';
  access_log /dev/stdout probe;
  error_log /dev/stderr warn;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  server {
    listen 80;
    # The nginx/OpenResty default; stated explicitly because it is the variable under test.
    client_max_body_size 1m;
    location / {
      proxy_pass http://host.docker.internal:18940;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
  }
}
