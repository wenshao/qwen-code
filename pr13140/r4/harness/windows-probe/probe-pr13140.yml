name: 'probe-pr13140-r4'
on:
  push:
    branches: ['probe/pr13140-**']
permissions:
  contents: 'read'
jobs:
  windows:
    runs-on: 'windows-2022'
    timeout-minutes: 30
    steps:
      - uses: 'actions/checkout@v4'
      - uses: 'actions/setup-node@v4'
        with:
          node-version: '22'
      - name: 'Install base and head CLI tarballs globally'
        shell: 'pwsh'
        run: |
          npm i -g --omit=optional --no-audit --no-fund --loglevel=error --prefix "$env:RUNNER_TEMP\base" probe\base.tgz
          npm i -g --omit=optional --no-audit --no-fund --loglevel=error --prefix "$env:RUNNER_TEMP\head" probe\head.tgz
          Get-ChildItem "$env:RUNNER_TEMP\head\node_modules\@qwen-code\qwen-code\cli-entry.js"
      - name: 'Run probe'
        shell: 'pwsh'
        run: |
          node probe\probe.mjs 2>&1 | Tee-Object -FilePath probe-out.txt
      - uses: 'actions/upload-artifact@v4'
        if: always()
        with:
          name: 'probe-pr13140-r4'
          path: 'probe-out.txt'
