name: 'Probe 11375 real build job'

permissions:
  contents: 'read'

on:
  push:
    branches:
      - 'probe/pr11375-e2e-real'

jobs:
  build:
    name: 'Build for E2E'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 30
    # Same fork gate as the legs, so a skipped build skips them all for the
    # same reason rather than failing them on a missing artifact.
    if: |-
      ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3

      - name: 'Set up Node.js'
        uses: 'actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e' # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'
          registry-url: 'https://registry.npmjs.org/'

      - name: 'Configure npm for rate limiting'
        run: |-
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm config set fetch-retries 5
          npm config set fetch-timeout 300000

      - name: 'Install dependencies'
        env:
          # The install must not build; the two steps below do it explicitly.
          QWEN_SKIP_PREPARE: '1'
        run: |-
          npm ci --prefer-offline --no-audit --progress=false

      - name: 'Build project'
        run: |-
          npm run build

      - name: 'Bundle CLI for E2E tests'
        run: |-
          npm run bundle

      - name: 'Pack build outputs'
        run: 'bash .github/scripts/e2e-build-pack.sh "${RUNNER_TEMP}/e2e-build.tar.gz"'

      # One bounded retry, same contract as the sandbox image build and
      # sandbox:none shard retries below: upload-artifact dying with
      # "Upload progress stalled." is a transient runner-to-blobstore
      # network class — run 34208365262 stalled ten minutes on the ~100MB
      # archive and reded the whole run before any leg started. A
      # deterministic failure (missing archive, via if-no-files-found:
      # error) fails both attempts and keeps the job red. The first
      # attempt's continue-on-error keeps that failure from failing the
      # job before the retry runs; the retry's overwrite is load-bearing
      # because the stalled attempt already reserved the e2e-build name
      # and upload-artifact v4+ 409s on a same-name upload in one run —
      # which is also what a manual re-run of this job after a stall
      # would hit without it.
      - name: 'Upload build artifact'
        id: 'upload-build'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' # v7.0.1
        continue-on-error: true
        with:
          name: 'e2e-build'
          path: '${{ runner.temp }}/e2e-build.tar.gz'
          if-no-files-found: 'error'
          # Already gzip-compressed.
          compression-level: 0
          retention-days: 1

      - name: 'Upload build artifact (retry)'
        if: "${{ steps.upload-build.outcome == 'failure' }}"
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' # v7.0.1
        with:
          name: 'e2e-build'
          path: '${{ runner.temp }}/e2e-build.tar.gz'
          if-no-files-found: 'error'
          # Already gzip-compressed.
          compression-level: 0
          retention-days: 1
          overwrite: true

  consumer:
    name: 'Consumer: download + unpack the real archive'
    runs-on: 'ubuntu-latest'
    needs:
      - 'build'
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3

      - name: 'Download build artifact'
        uses: 'actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c' # v8.0.1
        with:
          name: 'e2e-build'
          path: '${{ runner.temp }}/e2e-build'

      - name: 'Unpack build artifact'
        run: 'bash .github/scripts/e2e-build-unpack.sh "${RUNNER_TEMP}/e2e-build/e2e-build.tar.gz"'

      - name: 'REPORT the real archive size'
        run: |-
          echo "PROBE_REAL archive_bytes=$(stat -c %s "${RUNNER_TEMP}/e2e-build/e2e-build.tar.gz")"
          test -f bundle/gemini.js || ls -la bundle || true
          echo "PROBE_REAL RESULT=PASS consumer-unpacked-the-real-archive"

  real_payload_retry:
    name: 'Retry path at the real archive size'
    runs-on: 'ubuntu-latest'
    needs:
      - 'build'
    steps:
      - name: 'Download build artifact'
        uses: 'actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c' # v8.0.1
        with:
          name: 'e2e-build'
          path: '${{ runner.temp }}/dl'

      - name: 'Stage the real archive as the upload payload'
        run: |-
          cp "${RUNNER_TEMP}/dl/e2e-build.tar.gz" "${RUNNER_TEMP}/e2e-build.tar.gz"
          echo "PROBE_REAL_RETRY payload_bytes=$(stat -c %s "${RUNNER_TEMP}/e2e-build.tar.gz")"

      - name: 'Reserve the artifact name'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' # v7.0.1
        with:
          name: 'e2e-build-retryarm'
          path: '${{ runner.temp }}/e2e-build.tar.gz'
          if-no-files-found: 'error'
          compression-level: 0
          retention-days: 1

      - name: 'Upload build artifact'
        id: 'upload-build'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' # v7.0.1
        continue-on-error: true
        with:
          name: 'e2e-build-retryarm'
          path: '${{ runner.temp }}/e2e-build.tar.gz'
          if-no-files-found: 'error'
          compression-level: 0
          retention-days: 1

      - name: 'Upload build artifact (retry)'
        id: 'retry'
        if: "${{ steps.upload-build.outcome == 'failure' }}"
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' # v7.0.1
        with:
          name: 'e2e-build-retryarm'
          path: '${{ runner.temp }}/e2e-build.tar.gz'
          if-no-files-found: 'error'
          compression-level: 0
          retention-days: 1
          overwrite: true

      - name: 'REPORT'
        run: |-
          echo "PROBE_REAL_RETRY first.outcome=${{ steps.upload-build.outcome }} first.conclusion=${{ steps.upload-build.conclusion }} retry.outcome=${{ steps.retry.outcome }}"
          test "${{ steps.upload-build.outcome }}" = "failure"
          test "${{ steps.retry.outcome }}" = "success"
          echo "PROBE_REAL_RETRY RESULT=PASS retry-with-overwrite-works-at-real-archive-size"
