# PROBE ONLY — not part of the product. Generated from PR 12128's e2e.yml;
# the download / retry / announce steps below are byte-for-byte the PR's.
name: 'PR 12128 download-retry probe'

on:
  push:
    branches:
      - 'probe/pr12128-**'
  workflow_dispatch: {}

jobs:
  seed:
    name: 'Seed the e2e-build artifact'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Make a stand-in payload at the real archive path'
        run: |-
          mkdir -p "${RUNNER_TEMP}/seed"
          head -c 4194304 /dev/urandom >"${RUNNER_TEMP}/seed/e2e-build.tar.gz"
          ls -l "${RUNNER_TEMP}/seed"

      - name: 'Upload build artifact'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' # v7.0.1
        with:
          name: 'e2e-build'
          path: '${{ runner.temp }}/seed/e2e-build.tar.gz'
          if-no-files-found: 'error'
          compression-level: 0
          retention-days: 1

  leg_a_transient_absorbed:
    name: 'A · transient stall absorbed by the retry'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 20
    needs:
      - 'seed'
    steps:
      - name: 'Download build artifact'
        id: 'download-build'
        uses: 'actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c' # v8.0.1
        continue-on-error: true
        timeout-minutes: 10
        env:
          ACTIONS_RESULTS_URL: 'https://127.0.0.1:9/'
          ACTIONS_RUNTIME_URL: 'https://127.0.0.1:9/'
        with:
          name: 'e2e-build'
          path: '${{ runner.temp }}/e2e-build'

      - name: 'Download build artifact (retry)'
        if: "${{ steps.download-build.outcome == 'failure' }}"
        uses: 'actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c' # v8.0.1
        with:
          name: 'e2e-build'
          path: '${{ runner.temp }}/e2e-build'

      # An absorbed download stall leaves the leg green, so the main-CI
      # failure tracker never records it — the warning annotation keeps the
      # recurrence countable, mirroring the build job's upload announce.
      - name: 'Announce absorbed download failure'
        if: "${{ steps.download-build.outcome == 'failure' }}"
        run: |-
          echo "::warning::Download build artifact failed its first attempt and the retry absorbed it — count this toward the #12125 download-stall recurrence watch."

      - name: 'Observe the runner-side truth'
        if: "${{ always() }}"
        run: |-
          echo "outcome=${{ steps.download-build.outcome }}"
          echo "conclusion=${{ steps.download-build.conclusion }}"
          ls -l "${RUNNER_TEMP}/e2e-build" || echo "NOTHING AT THE UNPACK PATH"
          test -f "${RUNNER_TEMP}/e2e-build/e2e-build.tar.gz" \
            && echo "PAYLOAD-PRESENT $(wc -c <"${RUNNER_TEMP}/e2e-build/e2e-build.tar.gz") bytes" \
            || echo "PAYLOAD-ABSENT"

  leg_b_timeout_absorbed:
    name: 'B · hung first attempt killed by the time-box, retry recovers'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 20
    needs:
      - 'seed'
    steps:
      - name: 'Download build artifact'
        id: 'download-build'
        uses: 'actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c' # v8.0.1
        continue-on-error: true
        timeout-minutes: 1
        env:
          ACTIONS_RESULTS_URL: 'https://10.255.255.1/'
          ACTIONS_RUNTIME_URL: 'https://10.255.255.1/'
        with:
          name: 'e2e-build'
          path: '${{ runner.temp }}/e2e-build'

      - name: 'Download build artifact (retry)'
        if: "${{ steps.download-build.outcome == 'failure' }}"
        uses: 'actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c' # v8.0.1
        with:
          name: 'e2e-build'
          path: '${{ runner.temp }}/e2e-build'

      # An absorbed download stall leaves the leg green, so the main-CI
      # failure tracker never records it — the warning annotation keeps the
      # recurrence countable, mirroring the build job's upload announce.
      - name: 'Announce absorbed download failure'
        if: "${{ steps.download-build.outcome == 'failure' }}"
        run: |-
          echo "::warning::Download build artifact failed its first attempt and the retry absorbed it — count this toward the #12125 download-stall recurrence watch."

      - name: 'Observe the runner-side truth'
        if: "${{ always() }}"
        run: |-
          echo "outcome=${{ steps.download-build.outcome }}"
          echo "conclusion=${{ steps.download-build.conclusion }}"
          ls -l "${RUNNER_TEMP}/e2e-build" || echo "NOTHING AT THE UNPACK PATH"
          test -f "${RUNNER_TEMP}/e2e-build/e2e-build.tar.gz" \
            && echo "PAYLOAD-PRESENT $(wc -c <"${RUNNER_TEMP}/e2e-build/e2e-build.tar.gz") bytes" \
            || echo "PAYLOAD-ABSENT"

  leg_c_control_no_failure:
    name: 'C · control, first attempt succeeds'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 20
    needs:
      - 'seed'
    steps:
      - name: 'Download build artifact'
        id: 'download-build'
        uses: 'actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c' # v8.0.1
        continue-on-error: true
        timeout-minutes: 10
        with:
          name: 'e2e-build'
          path: '${{ runner.temp }}/e2e-build'

      - name: 'Download build artifact (retry)'
        if: "${{ steps.download-build.outcome == 'failure' }}"
        uses: 'actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c' # v8.0.1
        with:
          name: 'e2e-build'
          path: '${{ runner.temp }}/e2e-build'

      # An absorbed download stall leaves the leg green, so the main-CI
      # failure tracker never records it — the warning annotation keeps the
      # recurrence countable, mirroring the build job's upload announce.
      - name: 'Announce absorbed download failure'
        if: "${{ steps.download-build.outcome == 'failure' }}"
        run: |-
          echo "::warning::Download build artifact failed its first attempt and the retry absorbed it — count this toward the #12125 download-stall recurrence watch."

      - name: 'Observe the runner-side truth'
        if: "${{ always() }}"
        run: |-
          echo "outcome=${{ steps.download-build.outcome }}"
          echo "conclusion=${{ steps.download-build.conclusion }}"
          ls -l "${RUNNER_TEMP}/e2e-build" || echo "NOTHING AT THE UNPACK PATH"
          test -f "${RUNNER_TEMP}/e2e-build/e2e-build.tar.gz" \
            && echo "PAYLOAD-PRESENT $(wc -c <"${RUNNER_TEMP}/e2e-build/e2e-build.tar.gz") bytes" \
            || echo "PAYLOAD-ABSENT"

  leg_d_deterministic_missing:
    name: 'D · artifact genuinely missing, leg must stay red'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 20
    needs:
      - 'seed'
    steps:
      - name: 'Download build artifact'
        id: 'download-build'
        uses: 'actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c' # v8.0.1
        continue-on-error: true
        timeout-minutes: 10
        with:
          name: 'e2e-build-does-not-exist'
          path: '${{ runner.temp }}/e2e-build'

      - name: 'Download build artifact (retry)'
        if: "${{ steps.download-build.outcome == 'failure' }}"
        uses: 'actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c' # v8.0.1
        with:
          name: 'e2e-build-does-not-exist'
          path: '${{ runner.temp }}/e2e-build'

      # An absorbed download stall leaves the leg green, so the main-CI
      # failure tracker never records it — the warning annotation keeps the
      # recurrence countable, mirroring the build job's upload announce.
      - name: 'Announce absorbed download failure'
        if: "${{ steps.download-build.outcome == 'failure' }}"
        run: |-
          echo "::warning::Download build artifact failed its first attempt and the retry absorbed it — count this toward the #12125 download-stall recurrence watch."

      - name: 'Observe the runner-side truth'
        if: "${{ always() }}"
        run: |-
          echo "outcome=${{ steps.download-build.outcome }}"
          echo "conclusion=${{ steps.download-build.conclusion }}"
          ls -l "${RUNNER_TEMP}/e2e-build" || echo "NOTHING AT THE UNPACK PATH"
          test -f "${RUNNER_TEMP}/e2e-build/e2e-build.tar.gz" \
            && echo "PAYLOAD-PRESENT $(wc -c <"${RUNNER_TEMP}/e2e-build/e2e-build.tar.gz") bytes" \
            || echo "PAYLOAD-ABSENT"

  leg_e_timeout_semantics:
    name: 'E · step time-box under continue-on-error (pure semantic)'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 10
    steps:
      - name: 'Hang past the time-box'
        id: 'download-build'
        continue-on-error: true
        timeout-minutes: 1
        run: 'sleep 300'

      - name: 'Retry gated exactly like the PR gates it'
        id: 'retry'
        if: "${{ steps.download-build.outcome == 'failure' }}"
        run: 'echo RETRY-RAN'

      - name: 'Observe'
        if: "${{ always() }}"
        run: |-
          echo "outcome=${{ steps.download-build.outcome }}"
          echo "conclusion=${{ steps.download-build.conclusion }}"
          echo "retry_outcome=${{ steps.retry.outcome }}"

  verdict:
    name: 'Verdict'
    runs-on: 'ubuntu-latest'
    if: "${{ always() }}"
    needs:
      - 'leg_a_transient_absorbed'
      - 'leg_b_timeout_absorbed'
      - 'leg_c_control_no_failure'
      - 'leg_d_deterministic_missing'
      - 'leg_e_timeout_semantics'
    steps:
      - name: 'Print the result matrix'
        run: |-
          echo "leg_a_transient_absorbed=${{ needs.leg_a_transient_absorbed.result }} (expected success)"
          echo "leg_b_timeout_absorbed=${{ needs.leg_b_timeout_absorbed.result }} (expected success)"
          echo "leg_c_control_no_failure=${{ needs.leg_c_control_no_failure.result }} (expected success)"
          echo "leg_d_deterministic_missing=${{ needs.leg_d_deterministic_missing.result }} (expected failure)"
          echo "leg_e_timeout_semantics=${{ needs.leg_e_timeout_semantics.result }}"
