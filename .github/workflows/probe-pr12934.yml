name: 'probe-pr12934'
on:
  push:
    branches: ['probe/pr12934-**']
permissions:
  contents: 'read'
jobs:
  windows:
    runs-on: 'windows-2022'
    timeout-minutes: 20
    steps:
      - shell: 'powershell'
        run: 'git config --global core.autocrlf false'
      - uses: 'actions/checkout@v4'
      - uses: 'actions/setup-node@v4'
        with:
          node-version: '22.x'
      - name: 'Fold probe (final head lite)'
        shell: 'bash'
        run: |-
          mkdir -p probe-out
          node .probe/fold-probe.mjs .probe/lite-head.mjs 2>&1 | tee probe-out/fold-final.txt
      - name: 'Fold probe (candidate lite)'
        shell: 'bash'
        run: 'node .probe/fold-probe.mjs .probe/lite-candidate.mjs 2>&1 | tee probe-out/fold-candidate.txt'
      - name: 'Spawn oracle with the candidate'
        shell: 'bash'
        run: |-
          node .probe/spawn-oracle.mjs .probe/lite-candidate.mjs 1500 12934 > probe-out/oracle-win-candidate.txt 2>&1; echo "exit $?"
          grep -E 'ORACLE_SUMMARY|"case":"empty name"|UNDER' probe-out/oracle-win-candidate.txt | cut -c1-400
      - uses: 'actions/upload-artifact@v4'
        if: '${{ !cancelled() }}'
        with:
          name: 'probe-out'
          path: 'probe-out'
