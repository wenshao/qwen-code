# GENERATED for PR #10036 verification.
# release.yml's notify_failure gate opens only on `needs.<job>.result == 'failure'`.
# This probe records what `needs.<job>.result` actually is when an upstream job
# never gets a runner and the run is cancelled -- the pre-claim pool-outage shape.
name: 'PR10036 probe C (notifier gate)'

on:
  push:
    branches:
      - 'verify/pr10036-probe-c'
  workflow_dispatch:

permissions:
  contents: 'read'

jobs:
  never_claimed:
    name: 'job that no runner can claim'
    runs-on:
      - 'self-hosted'
      - 'linux'
      - 'x64'
      - 'label-that-does-not-exist-pr10036'
    steps:
      - run: 'echo unreachable'

  notifier_replica:
    name: 'notify_failure gate replica'
    runs-on: 'ubuntu-latest'
    needs:
      - 'never_claimed'
    if: "${{ always() }}"
    steps:
      - name: 'Report upstream result and whether the release gate would open'
        run: |-
          echo "needs.never_claimed.result = ${{ needs.never_claimed.result }}"
          echo "release.yml gate expression (result == 'failure') -> ${{ needs.never_claimed.result == 'failure' }}"
