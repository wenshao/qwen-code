name: 'Probe 11375 stalled upload'

on:
  push:
    branches:
      - 'probe/pr11375-upload-retry'

permissions:
  contents: 'read'
  actions: 'read'

jobs:
  g_killed_mid_transfer:
    name: 'G upload killed mid-transfer: name reserved?'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Build a payload too large to finish in one minute'
        run: |-
          fallocate -l 24G "${RUNNER_TEMP}/big.tar.gz"
          mkdir -p "${RUNNER_TEMP}/payload" && echo "RETRY-PAYLOAD-V2" > "${RUNNER_TEMP}/payload/marker.txt"
          tar -czf "${RUNNER_TEMP}/e2e-build.tar.gz" -C "${RUNNER_TEMP}/payload" .
          ls -lh "${RUNNER_TEMP}/big.tar.gz"
          df -h "${RUNNER_TEMP}"

      - name: 'Upload build artifact (killed mid-transfer)'
        id: 'upload-build'
        timeout-minutes: 1
        continue-on-error: true
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' # v7.0.1
        with:
          name: 'probe-g'
          path: '${{ runner.temp }}/big.tar.gz'
          if-no-files-found: 'error'
          compression-level: 0
          retention-days: 1

      - name: 'Census run artifacts after the kill'
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |-
          echo "PROBE_G first.outcome=${{ steps.upload-build.outcome }} first.conclusion=${{ steps.upload-build.conclusion }}"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            --jq '"PROBE_G_TOTAL total_count=\(.total_count)", (.artifacts[] | "PROBE_G_ARTIFACT name=\(.name) size=\(.size_in_bytes)")' || true

      - name: 'Retry WITHOUT overwrite (does the reserved name 409?)'
        id: 'retry_no_overwrite'
        if: "${{ steps.upload-build.outcome == 'failure' }}"
        continue-on-error: true
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' # v7.0.1
        with:
          name: 'probe-g'
          path: '${{ runner.temp }}/e2e-build.tar.gz'
          if-no-files-found: 'error'
          compression-level: 0
          retention-days: 1

      - name: 'Retry WITH overwrite (the PR shape)'
        id: 'retry_overwrite'
        if: "${{ steps.upload-build.outcome == 'failure' }}"
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' # v7.0.1
        with:
          name: 'probe-g'
          path: '${{ runner.temp }}/e2e-build.tar.gz'
          if-no-files-found: 'error'
          compression-level: 0
          retention-days: 1
          overwrite: true

      - name: 'REPORT'
        run: |-
          echo "PROBE_G retry_no_overwrite.outcome=${{ steps.retry_no_overwrite.outcome }}"
          echo "PROBE_G retry_overwrite.outcome=${{ steps.retry_overwrite.outcome }}"
          test "${{ steps.retry_overwrite.outcome }}" = "success"
          echo "PROBE_G RESULT=PASS pr-shape-recovers-a-mid-transfer-kill"

  h_consumer:
    name: 'H consumer downloads after a mid-transfer kill + retry'
    runs-on: 'ubuntu-latest'
    needs:
      - 'g_killed_mid_transfer'
    steps:
      - name: 'Download build artifact'
        uses: 'actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c' # v8.0.1
        with:
          name: 'probe-g'
          path: '${{ runner.temp }}/dl'

      - name: 'ASSERT the consumer got the retry payload'
        run: |-
          ls -l "${RUNNER_TEMP}/dl"
          tar -xzf "${RUNNER_TEMP}/dl/e2e-build.tar.gz" -C "${RUNNER_TEMP}"
          echo "PROBE_H content=$(cat "${RUNNER_TEMP}/marker.txt")"
          test "$(cat "${RUNNER_TEMP}/marker.txt")" = "RETRY-PAYLOAD-V2"
          echo "PROBE_H RESULT=PASS consumer-got-retry-payload-after-kill"
