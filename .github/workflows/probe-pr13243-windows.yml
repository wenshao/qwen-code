name: 'probe-pr13243-windows'

# Verification probe for QwenLM/qwen-code#13243 on a GitHub-hosted Windows
# runner. Runs only on pushes to probe/pr13243-* branches of this fork.
on:
  push:
    branches: ['probe/pr13243-**']

permissions:
  contents: 'read'

jobs:
  probe:
    runs-on: 'windows-2022'
    timeout-minutes: 90
    defaults:
      run:
        shell: 'bash'
    env:
      BASE_SHA: 'd9c6f8c0fe73ed4076e16e0feb750aba4a89c54a'
      FILES: 'src/serve/managed-hook-runtime.test.ts src/serve/hosted-hook-session.test.ts'
      PROBE: 'src/serve/managed-hook-r43-probe.test.ts'
      RUNTIME: 'packages/cli/src/serve/managed-hook-runtime.ts'
      NO_COLOR: 'true'
    steps:
      - name: 'Disable CRLF conversion'
        shell: 'powershell'
        run: 'git config --global core.autocrlf false'

      - uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3
        with:
          fetch-depth: 0

      - uses: 'actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e' # v6.4.0
        with:
          node-version: '22.x'
          package-manager-cache: false

      - name: 'Runner facts'
        run: |-
          echo "PROBE_JSON {\"probe\":\"runner\",\"node\":\"$(node -v)\",\"os\":\"$(cmd //c ver | tr -d '\r\n')\",\"head\":\"$(git rev-parse HEAD)\",\"cpus\":\"${NUMBER_OF_PROCESSORS}\"}"

      - name: 'Native isAbsolute / pathToFileURL facts'
        run: 'node probe13243/native-paths.mjs | tee probe-native.txt'

      - name: 'Install dependencies'
        run: 'corepack pnpm install --frozen-lockfile --reporter=append-only'

      - name: 'R4-3 probe: head runtime'
        run: |-
          (cd packages/cli && PROBE_ARM=head npx vitest run "$PROBE" --reporter=verbose) 2>&1 | tee probe-r43-head.txt

      - name: 'R4-3 probe: head runtime + suggested fix'
        run: |-
          node probe13243/apply-fix.mjs
          git diff --stat
          (cd packages/cli && PROBE_ARM=head+fix npx vitest run "$PROBE" --reporter=verbose) 2>&1 | tee probe-r43-fix.txt
          git checkout -- "$RUNTIME"

      - name: 'R4-3 probe: merge-base runtime'
        run: |-
          git checkout "$BASE_SHA" -- "$RUNTIME"
          git diff --stat HEAD
          (cd packages/cli && PROBE_ARM=base npx vitest run "$PROBE" --reporter=verbose) 2>&1 | tee probe-r43-base.txt
          git checkout HEAD -- "$RUNTIME"

      - name: 'Head arm: PR suites (x3)'
        run: |-
          # shellcheck disable=SC2086
          bash probe13243/run-arm.sh head 3 $FILES | tee probe-head.txt

      - name: 'Base arm: merge-base code and tests (x2)'
        run: |-
          git checkout "$BASE_SHA" -- packages/cli/src/serve/managed-hook-runtime.ts packages/cli/src/serve/managed-hook-runtime.test.ts packages/cli/src/serve/hosted-hook-session.ts packages/cli/src/serve/hosted-hook-session.test.ts
          git diff --stat HEAD
          # shellcheck disable=SC2086
          bash probe13243/run-arm.sh base 2 $FILES | tee probe-base.txt
          git checkout HEAD -- packages/cli/src/serve

      - name: 'Collect'
        if: '${{ always() }}'
        run: |-
          mkdir -p probe-out
          cp probe-*.txt probe-out/ 2>/dev/null || true
          grep -h PROBE_JSON probe-out/*.txt | sort -u

      - uses: 'actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02' # v4.6.2
        if: '${{ always() }}'
        with:
          name: 'probe-pr13243-windows'
          path: 'probe-out/'
