name: 'probe-pr13243-windows'

# Verification probe for QwenLM/qwen-code#13243 (round 5, R12-1): run the
# head's hosted-harness-session.test.ts, whose strict stderr guard c4f98b15c5
# restored, on GitHub-hosted macOS and Windows. Push-triggered on probe branches.
on:
  push:
    branches: ['probe/pr13243-**']

permissions:
  contents: 'read'

jobs:
  strict-guard:
    strategy:
      fail-fast: false
      matrix:
        os: ['macos-latest', 'windows-2022']
    runs-on: '${{ matrix.os }}'
    timeout-minutes: 90
    defaults:
      run:
        shell: 'bash'
    env:
      NO_COLOR: 'true'
      TEST_FILE: 'src/serve/hosted-harness-session.test.ts'
    steps:
      - name: 'Disable CRLF conversion'
        run: 'git config --global core.autocrlf false'

      - uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3

      - uses: 'actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e' # v6.4.0
        with:
          node-version: '22.x'
          package-manager-cache: false

      - name: 'Install dependencies'
        run: 'corepack pnpm install --frozen-lockfile --reporter=append-only'

      - name: 'hosted-harness-session.test.ts (x3)'
        run: |-
          mkdir -p probe-out
          for i in 1 2 3; do
            OUT="probe-out/${{ matrix.os }}-hhs-${i}.txt"
            set +e
            (cd packages/cli && npx vitest run "$TEST_FILE") > "$OUT" 2>&1
            rc=$?
            set -e
            # The step shell is bash -eo pipefail: a grep with no match must not end the loop.
            TESTS=$({ grep -E '^ +Tests +' "$OUT" || true; } | tail -1 | sed -E 's/^ +Tests +//')
            STRAY=$({ grep -c 'writeStderrLineSafe" to not be called' "$OUT" || true; } | head -1)
            FAILED=$({ grep -E '^ FAIL ' "$OUT" || true; } | sort -u | sed -E 's/.*> //' | tr '\n' ';' | tr -d '"')
            echo "PROBE_JSON {\"os\":\"${{ matrix.os }}\",\"i\":${i},\"exit\":${rc},\"tests\":\"${TESTS}\",\"strayStderrFailures\":${STRAY},\"failed\":\"${FAILED}\"}" | tee -a probe-out/summary.txt
          done

      - uses: 'actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02' # v4.6.2
        if: '${{ always() }}'
        with:
          name: 'probe-pr13243-r12-1-${{ matrix.os }}'
          path: 'probe-out/'
