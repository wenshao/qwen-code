name: 'probe-pr12818-windows'

on:
  push:
    branches: ['probe/pr12818-**']

defaults:
  run:
    shell: 'bash'

jobs:
  windows:
    runs-on: 'windows-2022'
    timeout-minutes: 150
    permissions:
      contents: 'read'
    steps:
      - uses: 'actions/checkout@v4'

      # Mirrors ci.yml test_windows on the hosted fallback.
      - name: 'Point temp at a short-alias-free directory'
        shell: 'powershell'
        run: |-
          $temp = Join-Path $env:RUNNER_WORKSPACE 'qwen-code-temp'
          New-Item -ItemType Directory -Force -Path $temp | Out-Null
          "TEMP=$temp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$temp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: 'actions/setup-node@v4'
        with:
          node-version: '22.x'

      - name: 'Record the step environment'
        run: |-
          git log --oneline -3
          echo "MSYSTEM=${MSYSTEM-<unset>} TERM=${TERM-<unset>} ComSpec=${ComSpec-<unset>}"
          node -e "console.log('node sees MSYSTEM=' + process.env.MSYSTEM + ' TERM=' + process.env.TERM + ' ComSpec=' + process.env.ComSpec + ' release=' + require('os').release() + ' execPath=' + process.execPath)"
          which -a sleep bash || true
          cmd //d //s //c "where sleep & where bash & where pwsh" || true
          node -v

      - name: 'Install dependencies'
        run: |-
          set +e
          corepack pnpm install --frozen-lockfile --prefer-offline --reporter=append-only
          echo "install exit=$?"
          node -e "require.resolve('vitest/package.json', { paths: ['packages/cli'] }); console.log('vitest resolvable')"

      - name: 'Run arms'
        env:
          NO_COLOR: 'true'
          HOME: '${{ runner.temp }}/qwen-ci-home'
          USERPROFILE: '${{ runner.temp }}/qwen-ci-home'
          OPENAI_API_KEY: ''
          DASHSCOPE_API_KEY: ''
          QWEN_API_KEY: ''
          GEMINI_API_KEY: ''
          QWEN_DEFAULT_AUTH_TYPE: ''
        run: |-
          node -e "const fs = require('node:fs'); for (const key of ['HOME', 'USERPROFILE']) { const dir = process.env[key]; if (dir) fs.mkdirSync(dir, { recursive: true }); }"
          git config --global core.autocrlf false
          export TMPDIR="${RUNNER_TEMP:-${TMPDIR:-/tmp}}"
          # Which command strings Git Bash receives intact, then two candidate
          # WAIT_30_SECONDS fixes (A3 per-shell quoting, A4 leading command).
          PROBE_TAG=q bash probe/run.sh inherit 1 quoting
          PROBE_TAG=q bash probe/run.sh cmd 1 quoting
          for F in A3 A4; do
            PROBE_FIX=$F PROBE_TAG=$F bash probe/run.sh inherit 20 head-repeat probe head-M2 head-M1 head-M3
            PROBE_FIX=$F PROBE_TAG=$F bash probe/run.sh cmd 20 head-repeat probe head-M2 head-M1
          done
          echo '===== SUMMARY ====='
          cat probe-out*/*/summary.tsv
          echo '===== PROBES ====='
          cat probe-out*/*/probe.tsv || true

      - if: '${{ always() }}'
        uses: 'actions/upload-artifact@v4'
        with:
          name: 'probe-out'
          path: 'probe-out*'
