# Verification probe for QwenLM/qwen-code#12864: the sdk-java.yml push paths filter, copied from pr.
name: probe pr12864 paths pr
on:
  push:
    branches:
      - probe/pr12864-paths
    paths:
      - packages/sdk-java/**
      - "**/.mvn/**"
      - packages/core/src/config/approval-modes.json
      - packages/core/src/managed-runtime/**
      - packages/cli/src/config/**
      - packages/core/src/config/**
      - packages/core/src/core/**
      - packages/cli/src/commands/serve.ts
      - packages/cli/src/serve/**
      - packages/cli/src/acp-integration/**
      - packages/acp-bridge/**
      - integration-tests/fake-openai-server.ts
      - package.json
      - pnpm-lock.yaml
      - docs/developers/sdk-java.md
      - docs/design/java-daemon-sdk-alpha.md
      - scripts/run-java-daemon-sdk-e2e.ts
      - scripts/check-failsafe-reports.js
      - .github/workflows/sdk-java.yml
      - .github/workflows/release-sdk-java.yml
permissions:
  contents: read
jobs:
  match:
    runs-on: ubuntu-latest
    steps:
      - run: echo "sdk-java paths filter (pr) matched ${{ github.sha }}"; git --version
