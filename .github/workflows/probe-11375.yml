name: 'Probe 11375 upload retry'

on:
  push:
    branches:
      - 'probe/pr11375-upload-retry'

permissions:
  contents: 'read'
  actions: 'read'

jobs:
  a_happy_path:
    name: 'A first attempt succeeds -> retry skipped'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Pack build outputs'
        run: |-
          mkdir -p "${RUNNER_TEMP}/payload" && echo "RETRY-PAYLOAD-V2" > "${RUNNER_TEMP}/payload/marker.txt"
          tar -czf "${RUNNER_TEMP}/e2e-build.tar.gz" -C "${RUNNER_TEMP}/payload" .

      - name: 'Upload build artifact'
        id: 'upload-build'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' # v7.0.1
        continue-on-error: true
        with:
          name: 'probe-a'
          path: '${{ runner.temp }}/e2e-build.tar.gz'
          if-no-files-found: 'error'
          compression-level: 0
          retention-days: 1

      - name: 'Upload build artifact (retry)'
        id: 'retry'
        if: "${{ steps.upload-build.outcome == 'failure' }}"
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' # v7.0.1
        with:
          name: 'probe-a'
          path: '${{ runner.temp }}/e2e-build.tar.gz'
          if-no-files-found: 'error'
          compression-level: 0
          retention-days: 1
          overwrite: true

      - name: 'ASSERT no double upload on the happy path'
        run: |-
          echo "PROBE_A first.outcome=${{ steps.upload-build.outcome }} first.conclusion=${{ steps.upload-build.conclusion }} retry.outcome=${{ steps.retry.outcome }}"
          test "${{ steps.upload-build.outcome }}" = "success"
          test "${{ steps.retry.outcome }}" = "skipped"
          echo "PROBE_A RESULT=PASS retry-was-skipped"

  b_retry_overwrite:
    name: 'B reserved name -> first attempt fails, retry with overwrite wins'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Build both payloads'
        run: |-
          mkdir -p "${RUNNER_TEMP}/seed" "${RUNNER_TEMP}/payload"
          echo "SEED-PAYLOAD-V1" > "${RUNNER_TEMP}/seed/marker.txt"
          echo "RETRY-PAYLOAD-V2" > "${RUNNER_TEMP}/payload/marker.txt"
          tar -czf "${RUNNER_TEMP}/seed.tar.gz" -C "${RUNNER_TEMP}/seed" .
          tar -czf "${RUNNER_TEMP}/e2e-build.tar.gz" -C "${RUNNER_TEMP}/payload" .

      - name: 'Reserve the artifact name (stands in for the stalled attempt)'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' # v7.0.1
        with:
          name: 'probe-b'
          path: '${{ runner.temp }}/seed.tar.gz'
          if-no-files-found: 'error'
          compression-level: 0
          retention-days: 1

      - name: 'Upload build artifact'
        id: 'upload-build'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' # v7.0.1
        continue-on-error: true
        with:
          name: 'probe-b'
          path: '${{ runner.temp }}/e2e-build.tar.gz'
          if-no-files-found: 'error'
          compression-level: 0
          retention-days: 1

      - name: 'ASSERT outcome is failure while conclusion is success'
        run: |-
          echo "PROBE_B first.outcome=${{ steps.upload-build.outcome }} first.conclusion=${{ steps.upload-build.conclusion }}"
          test "${{ steps.upload-build.outcome }}" = "failure"
          test "${{ steps.upload-build.conclusion }}" = "success"
          echo "PROBE_B RESULT=PASS outcome-failure-conclusion-success"

      - name: 'Upload build artifact (retry)'
        id: 'retry'
        if: "${{ steps.upload-build.outcome == 'failure' }}"
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' # v7.0.1
        with:
          name: 'probe-b'
          path: '${{ runner.temp }}/e2e-build.tar.gz'
          if-no-files-found: 'error'
          compression-level: 0
          retention-days: 1
          overwrite: true

      - name: 'ASSERT the gated retry ran and succeeded'
        run: |-
          echo "PROBE_B retry.outcome=${{ steps.retry.outcome }}"
          test "${{ steps.retry.outcome }}" = "success"
          echo "PROBE_B RESULT=PASS retry-ran-and-succeeded"

  c_no_overwrite_control:
    name: 'C negative control: retry without overwrite'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Build both payloads'
        run: |-
          mkdir -p "${RUNNER_TEMP}/seed" "${RUNNER_TEMP}/payload"
          echo "SEED-PAYLOAD-V1" > "${RUNNER_TEMP}/seed/marker.txt"
          echo "RETRY-PAYLOAD-V2" > "${RUNNER_TEMP}/payload/marker.txt"
          tar -czf "${RUNNER_TEMP}/seed.tar.gz" -C "${RUNNER_TEMP}/seed" .
          tar -czf "${RUNNER_TEMP}/e2e-build.tar.gz" -C "${RUNNER_TEMP}/payload" .

      - name: 'Reserve the artifact name'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' # v7.0.1
        with:
          name: 'probe-c'
          path: '${{ runner.temp }}/seed.tar.gz'
          if-no-files-found: 'error'
          compression-level: 0
          retention-days: 1

      - name: 'Upload build artifact'
        id: 'upload-build'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' # v7.0.1
        continue-on-error: true
        with:
          name: 'probe-c'
          path: '${{ runner.temp }}/e2e-build.tar.gz'
          if-no-files-found: 'error'
          compression-level: 0
          retention-days: 1

      - name: 'Upload build artifact (retry WITHOUT overwrite)'
        id: 'retry'
        if: "${{ steps.upload-build.outcome == 'failure' }}"
        continue-on-error: true
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' # v7.0.1
        with:
          name: 'probe-c'
          path: '${{ runner.temp }}/e2e-build.tar.gz'
          if-no-files-found: 'error'
          compression-level: 0
          retention-days: 1

      - name: 'ASSERT the retry without overwrite fails'
        run: |-
          echo "PROBE_C first.outcome=${{ steps.upload-build.outcome }} retry.outcome=${{ steps.retry.outcome }}"
          test "${{ steps.retry.outcome }}" = "failure"
          echo "PROBE_C RESULT=PASS overwrite-is-load-bearing"

  d_double_failure:
    name: 'D deterministic failure reds the job'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Upload build artifact'
        id: 'upload-build'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' # v7.0.1
        continue-on-error: true
        with:
          name: 'probe-d'
          path: '${{ runner.temp }}/e2e-build.tar.gz'
          if-no-files-found: 'error'
          compression-level: 0
          retention-days: 1

      - name: 'Upload build artifact (retry)'
        id: 'retry'
        if: "${{ steps.upload-build.outcome == 'failure' }}"
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' # v7.0.1
        with:
          name: 'probe-d'
          path: '${{ runner.temp }}/e2e-build.tar.gz'
          if-no-files-found: 'error'
          compression-level: 0
          retention-days: 1
          overwrite: true

      - name: 'UNREACHABLE if the retry correctly fails the job'
        run: 'echo "PROBE_D RESULT=FAIL job survived a double failure"'

  e_aborted_upload:
    name: 'E aborted upload: does it reserve the name'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Build an unreadable payload (fails after artifact creation)'
        run: |-
          mkdir -p "${RUNNER_TEMP}/payload" && echo "RETRY-PAYLOAD-V2" > "${RUNNER_TEMP}/payload/marker.txt"
          tar -czf "${RUNNER_TEMP}/e2e-build.tar.gz" -C "${RUNNER_TEMP}/payload" .
          cp "${RUNNER_TEMP}/e2e-build.tar.gz" "${RUNNER_TEMP}/unreadable.tar.gz"
          sudo chown root:root "${RUNNER_TEMP}/unreadable.tar.gz"
          sudo chmod 000 "${RUNNER_TEMP}/unreadable.tar.gz"
          ls -l "${RUNNER_TEMP}/unreadable.tar.gz"

      - name: 'Upload build artifact (aborts mid-flight)'
        id: 'upload-build'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' # v7.0.1
        continue-on-error: true
        with:
          name: 'probe-e'
          path: '${{ runner.temp }}/unreadable.tar.gz'
          if-no-files-found: 'error'
          compression-level: 0
          retention-days: 1

      - name: 'Census the run artifacts after the aborted attempt'
        env:
          GH_TOKEN: '${{ github.token }}'
        run: |-
          echo "PROBE_E first.outcome=${{ steps.upload-build.outcome }}"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            --jq '.artifacts[] | "PROBE_E_ARTIFACT name=\(.name) size=\(.size_in_bytes) expired=\(.expired)"' || true

      - name: 'Upload build artifact (retry WITHOUT overwrite)'
        id: 'retry_no_overwrite'
        if: "${{ steps.upload-build.outcome == 'failure' }}"
        continue-on-error: true
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' # v7.0.1
        with:
          name: 'probe-e'
          path: '${{ runner.temp }}/e2e-build.tar.gz'
          if-no-files-found: 'error'
          compression-level: 0
          retention-days: 1

      - name: 'Upload build artifact (retry WITH overwrite)'
        id: 'retry_overwrite'
        if: "${{ steps.upload-build.outcome == 'failure' }}"
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' # v7.0.1
        with:
          name: 'probe-e'
          path: '${{ runner.temp }}/e2e-build.tar.gz'
          if-no-files-found: 'error'
          compression-level: 0
          retention-days: 1
          overwrite: true

      - name: 'REPORT the aborted-attempt reservation result'
        run: |-
          echo "PROBE_E retry_no_overwrite.outcome=${{ steps.retry_no_overwrite.outcome }}"
          echo "PROBE_E retry_overwrite.outcome=${{ steps.retry_overwrite.outcome }}"
          test "${{ steps.retry_overwrite.outcome }}" = "success"
          echo "PROBE_E RESULT=PASS overwrite-retry-recovers-an-aborted-attempt"

  f_consumer:
    name: 'F consumer downloads what the retry published'
    runs-on: 'ubuntu-latest'
    needs:
      - 'b_retry_overwrite'
    steps:
      - name: 'Download build artifact'
        uses: 'actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c' # v8.0.1
        with:
          name: 'probe-b'
          path: '${{ runner.temp }}/dl'

      - name: 'ASSERT the consumer sees the retry payload, not the seed'
        run: |-
          tar -xzf "${RUNNER_TEMP}/dl/e2e-build.tar.gz" -C "${RUNNER_TEMP}"
          echo "PROBE_F content=$(cat "${RUNNER_TEMP}/marker.txt")"
          test "$(cat "${RUNNER_TEMP}/marker.txt")" = "RETRY-PAYLOAD-V2"
          echo "PROBE_F RESULT=PASS consumer-got-retry-payload"
