name: 'PR11110 footgun: zero'
on:
  push:
    branches: ['probe/pr11110-footgun']
jobs:
  probe:
    name: 'operator sets the knob to 0'
    runs-on: 'ubuntu-latest'
    timeout-minutes: "${{ fromJSON(vars.QWEN_PROBE_ZERO || '5') }}"
    steps:
      - name: 'Show what the knob evaluated to'
        run: |
          echo "raw var = <${{ vars.QWEN_PROBE_ZERO }}>"
          echo "job is running, so the bound was accepted"
          sleep 90
          echo "REACHED THE END after 90s"
