name: 'PR11110 timeout-expression probe'

on:
  push:
    branches:
      - 'probe/pr11110-fallback'
      - 'probe/pr11110-tuned'

jobs:
  # Stand-in for release.yml's `prepare`: the aggregate's gate reads its result.
  prepare:
    name: 'Prepare (stand-in)'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 5
    steps:
      - name: 'Prepared'
        run: 'echo prepared'

  # VERBATIM copies of the two strings PR #11110 puts on quality_static /
  # quality_build, used as real job-level `timeout-minutes` values. If GitHub
  # cannot evaluate them at job level this job never starts.
  echo_production_expr:
    name: 'Production expressions (verbatim)'
    runs-on: 'ubuntu-latest'
    timeout-minutes: "${{ fromJSON(vars.QWEN_RELEASE_STATIC_TIMEOUT_MINUTES || '30') }}"
    steps:
      - name: 'Evaluate both production expressions'
        run: |
          echo "raw   vars.QWEN_RELEASE_STATIC_TIMEOUT_MINUTES = <${{ vars.QWEN_RELEASE_STATIC_TIMEOUT_MINUTES }}>"
          echo "raw   vars.QWEN_RELEASE_BUILD_TIMEOUT_MINUTES  = <${{ vars.QWEN_RELEASE_BUILD_TIMEOUT_MINUTES }}>"
          echo "value static = ${{ fromJSON(vars.QWEN_RELEASE_STATIC_TIMEOUT_MINUTES || '30') }}"
          echo "value build  = ${{ fromJSON(vars.QWEN_RELEASE_BUILD_TIMEOUT_MINUTES || '45') }}"
          echo "toJSON static = ${{ toJSON(fromJSON(vars.QWEN_RELEASE_STATIC_TIMEOUT_MINUTES || '30')) }}   (bare digits => Number, quoted => String)"
          echo "toJSON build  = ${{ toJSON(fromJSON(vars.QWEN_RELEASE_BUILD_TIMEOUT_MINUTES || '45')) }}"

  # Same expression SHAPE, scaled down so the bound can actually be reached.
  # Fallback '1'; run A leaves the var unset, run B sets it to 3.
  scaled_timeout:
    name: 'Scaled bound (sleeps past it)'
    runs-on: 'ubuntu-latest'
    timeout-minutes: "${{ fromJSON(vars.QWEN_PROBE_TIMEOUT_MINUTES || '1') }}"
    steps:
      - name: 'Sleep well past the bound'
        run: |
          echo "job started at $(date -u +%H:%M:%S)Z"
          sleep 420
          echo "REACHED THE END - the bound did NOT fire"

  # release.yml's own aggregate gate + fail-closed loop, copied.
  quality:
    name: 'Quality Checks (aggregate)'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 5
    needs:
      - 'prepare'
      - 'echo_production_expr'
      - 'scaled_timeout'
    if: |-
      ${{ !cancelled() && needs.prepare.result == 'success' }}
    steps:
      - name: 'Verify quality results'
        env:
          EXPR_RESULT: '${{ needs.echo_production_expr.result }}'
          SCALED_RESULT: '${{ needs.scaled_timeout.result }}'
        run: |
          echo "echo_production_expr = ${EXPR_RESULT}"
          echo "scaled_timeout       = ${SCALED_RESULT}"
          for result in "${EXPR_RESULT}" "${SCALED_RESULT}"; do
            if [[ "${result}" != 'success' ]]; then
              echo "::error::A release quality check did not succeed."
              exit 1
            fi
          done
