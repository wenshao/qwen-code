name: autofix-verify-r5

on:
  pull_request:
  workflow_dispatch:

jobs:
  fast-fail:
    runs-on: ubuntu-latest
    steps:
      - name: Fail at once
        run: |
          echo "deliberate fast failure for the autofix-pr verification fixture"
          exit 1

  slow-fail:
    runs-on: ubuntu-latest
    steps:
      - name: Fail after a while
        run: |
          echo "deliberate slow failure: this job is still running while the first one fails"
          sleep 300
          exit 1