name: PR 14248 probe probe/14248-mutant
'on':
  push:
    branches:
    - probe/14248-mutant
permissions:
  contents: read
jobs:
  event-transport-multi-node:
    name: EventTransport multi-node gates / RocketMQ 5.5.1 + MySQL 8.4 / Java 21
    runs-on: ubuntu-latest
    timeout-minutes: 95
    services:
      mysql:
        image: mysql:8.4.6
        env:
          MYSQL_DATABASE: event_transport_test
          MYSQL_ROOT_PASSWORD: multi-node-fixture
        ports:
        - 3306/tcp
        options: --health-cmd "mysqladmin ping -h 127.0.0.1 -pmulti-node-fixture" --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
    - name: Checkout
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
    - name: Set up Java
      uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
      with:
        distribution: temurin
        java-version: '17

          21'
        cache: maven
        cache-dependency-path: packages/sdk-java/**/pom.xml
        settings-path: ${{ runner.temp }}/setup-java-m2
    - name: Set up Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
      with:
        node-version: '22'
        package-manager-cache: false
    - name: Enable Corepack
      run: corepack enable
    - name: Install, build and bundle CLI
      run: corepack pnpm install --frozen-lockfile --prefer-offline --reporter=append-only
    - name: Install Managed Agent dependencies
      env:
        MAVEN_ARGS: --settings ${{ runner.temp }}/setup-java-m2/settings.xml --toolchains ${{ runner.temp }}/setup-java-m2/toolchains.xml
      run: 'mvn --batch-mode --no-transfer-progress -f packages/sdk-java/qwencode/pom.xml -DskipTests -Dgpg.skip=true -Dmaven.javadoc.skip=true install

        mvn --batch-mode --no-transfer-progress -f packages/sdk-java/runtime-broker/pom.xml -DskipTests -Dspotbugs.skip=true install'
    - name: Install libfaketime
      run: 'sudo apt-get update -q

        sudo apt-get install -y -q faketime

        test -f /usr/lib/x86_64-linux-gnu/faketime/libfaketimeMT.so.1'
    - name: Cache the RocketMQ distribution
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ runner.temp }}/rocketmq-dist
        key: rocketmq-5.5.1-bin-release
    - name: Start the RocketMQ LiteTopic cluster
      id: broker
      timeout-minutes: 10
      env:
        RMQ_WORK_DIR: ${{ runner.temp }}/rocketmq
        RMQ_CACHE_DIR: ${{ runner.temp }}/rocketmq-dist
        RMQ_EXTRA_GROUPS: qwen-transport-gate-oracle
      run: scripts/rocketmq-lite-broker.sh start
    - name: Verify the EventTransport multi-node gates
      timeout-minutes: 65
      env:
        MAVEN_ARGS: --settings ${{ runner.temp }}/setup-java-m2/settings.xml --toolchains ${{ runner.temp }}/setup-java-m2/toolchains.xml
        MYSQL_PORT: ${{ job.services.mysql.ports['3306'] }}
      run: "mvn --batch-mode --no-transfer-progress -f packages/sdk-java/managed-agent-server/pom.xml \\\n  -Pevent-transport-multi-node-gates \\\n  -Dnode.executable=\"$(command -v node)\" \\\n  -Dqwen.cli.entry=\"${GITHUB_WORKSPACE}/dist/cli.js\" \\\n  -Dmysql.url=\"jdbc:mysql://127.0.0.1:${MYSQL_PORT}/event_transport_test?allowPublicKeyRetrieval=true&useSSL=false\" \\\n  -Dmysql.user=root -Dmysql.password=multi-node-fixture \\\n  -Dqwen.gate.rocketmq.endpoints=127.0.0.1:18081 \\\n  -Dqwen.gate.rocketmq.topic=qwen-managed-events \\\n  -Dqwen.gate.rocketmq.work-dir=\"${RUNNER_TEMP}/rocketmq\" \\\n  -Dqwen.gate.faketime.library=/usr/lib/x86_64-linux-gnu/faketime/libfaketimeMT.so.1 \\\n  -Dit.test=EventTransportMultiNodeGate#turnDispatchFollowsTheDatabaseClockNotTheNode clean verify && \\\n  node scripts/check-failsafe-reports.js event-transport-multi-node packages/sdk-java/managed-agent-server"
    - name: Upload multi-node gate reports
      if: ${{ always() && steps.broker.outcome != 'skipped' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: event-transport-multi-node-gate-reports
        path: 'packages/sdk-java/managed-agent-server/target/failsafe-reports/

          packages/sdk-java/managed-agent-server/target/mq3-multi-node/

          ${{ runner.temp }}/rocketmq/logs/

          ${{ runner.temp }}/rocketmq/home/logs/'
        retention-days: 7
    - name: Stop the RocketMQ cluster
      if: ${{ always() && steps.broker.outcome != 'skipped' }}
      env:
        RMQ_WORK_DIR: ${{ runner.temp }}/rocketmq
      run: scripts/rocketmq-lite-broker.sh stop
