name: probe-pr12568-ntfs
on:
  push:
    branches: ['probe/pr12568-**']
permissions:
  contents: read
jobs:
  hardlink-stat:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - run: |
          mkdir -p 'C:/probe12568/tmpC' "$RUNNER_TEMP/tmpC"
          TEMP='C:\probe12568\tmpC' TMP='C:\probe12568\tmpC' node probe-pr12568/hardlink-stat.cjs C
          TEMP="$RUNNER_TEMP\\tmpC" TMP="$RUNNER_TEMP\\tmpC" node probe-pr12568/hardlink-stat.cjs D
          node probe-pr12568/hardlink-stat.cjs default-TEMP
