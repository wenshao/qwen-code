<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#f8fafc"/>
  <rect x="0" y="0" width="1600" height="86" fill="#0f172a"/>
  <text x="40" y="40" fill="#ffffff" font-family="sans-serif" font-size="26" font-weight="bold">Proposed: an SSH panel in the Qwen Code Web Shell</text>
  <text x="40" y="68" fill="#94a3b8" font-family="sans-serif" font-size="17">Reference target: dsh-web / dsh-ssh (Apache-2.0). This diagram is an original proposal, not a copy.</text>

  <!-- Box A: host registry -->
  <rect x="40" y="120" width="400" height="330" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="40" y="120" width="400" height="44" rx="10" fill="#eff6ff"/>
  <text x="60" y="148" fill="#1d4ed8" font-family="sans-serif" font-size="19" font-weight="bold">A. Host registry</text>
  <text x="60" y="186" fill="#0f172a" font-family="sans-serif" font-size="16" font-weight="bold">read from ~/.ssh/config — no new registry</text>
  <rect x="60" y="202" width="360" height="52" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="76" y="224" fill="#0f172a" font-family="monospace" font-size="15">Host prod-web</text>
  <text x="76" y="244" fill="#64748b" font-family="monospace" font-size="13">IdentityFile + ProxyJump bastion</text>
  <rect x="60" y="262" width="360" height="52" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="76" y="284" fill="#0f172a" font-family="monospace" font-size="15">Host staging</text>
  <text x="76" y="304" fill="#64748b" font-family="monospace" font-size="13">User / Port / Match rules honoured</text>
  <rect x="60" y="322" width="360" height="52" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="76" y="344" fill="#0f172a" font-family="monospace" font-size="15">Host gpu-box</text>
  <text x="76" y="364" fill="#64748b" font-family="monospace" font-size="13">keys stay in ssh-agent / ~/.ssh</text>
  <text x="60" y="404" fill="#475569" font-family="sans-serif" font-size="14">A Host entry already is an environment id.</text>
  <text x="60" y="426" fill="#475569" font-family="sans-serif" font-size="14">No new credential class, no new persistence.</text>

  <!-- Box B: the panel -->
  <rect x="500" y="120" width="620" height="430" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <rect x="500" y="120" width="620" height="44" rx="10" fill="#f0fdfa"/>
  <text x="520" y="148" fill="#0f766e" font-family="sans-serif" font-size="19" font-weight="bold">B. Right-panel tab: SSH (new)</text>
  <rect x="520" y="180" width="580" height="76" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="538" y="206" fill="#0f172a" font-family="sans-serif" font-size="16" font-weight="bold">Terminal</text>
  <text x="538" y="230" fill="#64748b" font-family="sans-serif" font-size="14">interactive xterm PTY over an ssh2 channel; resize + replay</text>
  <rect x="520" y="264" width="580" height="76" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="538" y="290" fill="#0f172a" font-family="sans-serif" font-size="16" font-weight="bold">Files</text>
  <text x="538" y="314" fill="#64748b" font-family="sans-serif" font-size="14">SFTP upload / download with progress, resume, remote browse</text>
  <rect x="520" y="348" width="580" height="76" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="538" y="374" fill="#0f172a" font-family="sans-serif" font-size="16" font-weight="bold">Tunnels</text>
  <text x="538" y="398" fill="#64748b" font-family="sans-serif" font-size="14">local port-forwards: list, status, one-click start / stop</text>
  <rect x="520" y="432" width="580" height="76" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="538" y="458" fill="#0f172a" font-family="sans-serif" font-size="16" font-weight="bold">Cluster</text>
  <text x="538" y="482" fill="#64748b" font-family="sans-serif" font-size="14">run one command across N hosts; per-host result cards</text>
  <text x="520" y="532" fill="#475569" font-family="sans-serif" font-size="14">Every route loopback-only; a paired/remote client never reaches them.</text>

  <!-- Box C: connection layer -->
  <rect x="1170" y="120" width="390" height="330" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <rect x="1170" y="120" width="390" height="44" rx="10" fill="#fffbeb"/>
  <text x="1190" y="148" fill="#b45309" font-family="sans-serif" font-size="19" font-weight="bold">C. Shared connection layer</text>
  <text x="1190" y="188" fill="#0f172a" font-family="sans-serif" font-size="15">one ssh2 pool per Host</text>
  <text x="1190" y="214" fill="#0f172a" font-family="sans-serif" font-size="15">ControlMaster-style multiplexing</text>
  <text x="1190" y="240" fill="#0f172a" font-family="sans-serif" font-size="15">jump hosts resolved from config</text>
  <text x="1190" y="266" fill="#0f172a" font-family="sans-serif" font-size="15">reconnect with capped backoff</text>
  <line x1="1190" y1="286" x2="1540" y2="286" stroke="#e2e8f0" stroke-width="2"/>
  <text x="1190" y="316" fill="#475569" font-family="sans-serif" font-size="14">Used by BOTH the panel (B)</text>
  <text x="1190" y="340" fill="#475569" font-family="sans-serif" font-size="14">and the agent transport (#11746),</text>
  <text x="1190" y="364" fill="#475569" font-family="sans-serif" font-size="14">so one handshake serves both faces.</text>
  <text x="1190" y="404" fill="#be123c" font-family="sans-serif" font-size="14">No stored passwords. Keys never</text>
  <text x="1190" y="426" fill="#be123c" font-family="sans-serif" font-size="14">leave ~/.ssh or ssh-agent.</text>

  <!-- Box D: relationship -->
  <rect x="500" y="590" width="1060" height="180" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <rect x="500" y="590" width="1060" height="44" rx="10" fill="#f1f5f9"/>
  <text x="520" y="618" fill="#334155" font-family="sans-serif" font-size="19" font-weight="bold">D. Complementary to #11746, not competing with it</text>
  <text x="520" y="662" fill="#0f172a" font-family="sans-serif" font-size="15">#11746 (open, P2, blocked): SSH as an ExecutionEnvironment transport — agent tools run ON the remote host.</text>
  <text x="520" y="690" fill="#0f172a" font-family="sans-serif" font-size="15">This issue: a human-facing panel — terminal, transfer, tunnels, cluster — for the operator, in the Web Shell.</text>
  <text x="520" y="718" fill="#475569" font-family="sans-serif" font-size="15">Same registry (~/.ssh/config), same auth (keys), same pool (C). Different layer, different user.</text>
  <text x="520" y="746" fill="#475569" font-family="sans-serif" font-size="15">Optionally expose ssh_exec / ssh_upload / ssh_download / ssh_tunnel as agent tools, gated per call.</text>

  <!-- arrows -->
  <line x1="440" y1="285" x2="492" y2="285" stroke="#1d4ed8" stroke-width="3"/>
  <polygon points="500,285 486,278 486,292" fill="#1d4ed8"/>
  <line x1="1120" y1="285" x2="1162" y2="285" stroke="#0f766e" stroke-width="3"/>
  <polygon points="1170,285 1156,278 1156,292" fill="#0f766e"/>
  <line x1="810" y1="550" x2="810" y2="582" stroke="#64748b" stroke-width="3"/>
  <polygon points="810,590 803,576 817,576" fill="#64748b"/>
  <line x1="1365" y1="450" x2="1365" y2="582" stroke="#b45309" stroke-width="3"/>
  <polygon points="1365,590 1358,576 1372,576" fill="#b45309"/>

  <text x="40" y="830" fill="#64748b" font-family="sans-serif" font-size="14">Guardrails: loopback-only routes · per-host confirmation for destructive ops · no plaintext credential storage · jump hosts and Match rules honoured verbatim from ~/.ssh/config</text>
  <text x="40" y="860" fill="#94a3b8" font-family="sans-serif" font-size="13">Diagram authored for this issue (original work). Reference product: zhu1090093659/dsh-web, Apache-2.0.</text>
</svg>
